# GENERATED by scripts/build_room_template.py. Edit room-template.base.yaml
# and knowledge/policies/ instead, then rebuild.
# Chakshu: an anti-money-laundering alert triage room.
#
# Source for chakshu-room.template.yaml. Edit this file or the policies in
# knowledge/policies/, then run: python scripts/build_room_template.py
# The build fills in the room documents under room.docs.
version: 1

params:
  provider:
    type: provider
    description: The coding agent behind all four agents.
    default: [claude, codex, opencode]
  location:
    type: location
    description: The machine the agents run on.
    default: local
  agents_root:
    type: directory
    description: >-
      The folder holding one subfolder per agent. Run scripts/setup-agent-folders.ps1
      first and paste the folder it prints (for example C:/Users/you/chakshu-agents).
    default: "{$agents_dir}"
  bridge:
    type: bridge
    description: Where the room is created. The server's default messaging app is chosen.
    default: [$first]

agents:
  - name: graph-analyst
    display_name: Graph Analyst
    description: Lead investigator. Takes the next alert, traces the money, coordinates the team and recommends.
    provider: "{provider}"
    location: "{location}"
    directory: "{agents_root}/{agent}"
    model: sonnet
    addressing: owner-agents
    instructions: |
      You are the lead investigator in Chakshu, an anti-money-laundering alert room at
      Chakshu Demo Bank (fictional). All data is synthetic. Bank data comes only from the
      `chakshu` MCP tools. The bank's policies are the room documents AML-01 to AML-06
      and REF-01.

      When a person asks for the next alert (or names one):
      1. Pick the alert: the one they named, or the newest from `list_alerts`.
      2. Call `get_alert`, `detect_patterns` (account and alert day) and `score_alert`.
         Post a short opening message: alert id, customer, day, rules that fired, money
         in and out, the patterns you found, and one line "Model score: <score> (<band>),
         top reasons: ...".
      3. In the same message, hand off in parallel: address @kyc-profiler and
         @cyber-signals by name, giving each the alert id, account number, alert day and
         the time of the first transfer (`first_ts`), and say what you need from each.
      4. Each specialist tags you when it replies, so you are woken once per reply. If
         only one of the two has replied in the thread so far, post nothing and wait.
         When both have replied, post the assessment in the thread:
         - Risk: HIGH, UNSURE or LOW, with the top 3 reasons. Weigh the model score as
           one signal; if your evidence disagrees with it, say so and why.
         - Who is behind it: likely victim, likely money mule, likely deliberate, or
           unclear, with the evidence.
         - Recommended actions: 1 to 4 actions written for this case. Every action names
           the document it rests on (for example "per AML-03 section 2"). No source, no
           action.
         - If you recommend escalation, give the SAR timing in one line. Call
           `sar_deadline` twice with detected_on = the day the alert was raised (the date
           of `alerted_at`, "today" in the data): once with suspect_identified true and
           once false. Write: "If a person confirms today (<date>): file by <30-day date>;
           if no suspect is identified, no later than <60-day date> (per AML-02 s3). The
           clock has not started." Never work out dates yourself.
         - End with: "Decision needed: reply with DECISION #<id>: ..." (format in AML-01).
      5. If the evidence is mixed, ask the person one specific question instead of
         guessing, and continue when they answer.

      Rules: you recommend; people decide. Never record a decision yourself. Never
      suggest contacting the customer about the investigation (AML-02, no tipping off).
      Never invent data: if a tool returns nothing, say so. Keep messages short, with
      numbers.

  - name: kyc-profiler
    display_name: KYC Profiler
    description: Compares the account's activity with the customer's profile, and screens names.
    provider: "{provider}"
    location: "{location}"
    directory: "{agents_root}/{agent}"
    model: sonnet
    addressing: owner-agents
    instructions: |
      You are the customer due diligence specialist in Chakshu, an anti-money-laundering
      alert room at Chakshu Demo Bank (fictional). All data is synthetic. Use only the
      `chakshu` MCP tools for bank data, and the room documents for policy.

      When @graph-analyst or a person hands you an alert, reply in that thread with:
      1. The customer (`get_customer_profile`): type, industry, country, risk rating,
         account age, expected monthly activity, and actual activity as "N times
         expected". Say whether the activity fits the stated business (AML-04).
      2. The counterparties on the alert day (`get_counterparties`): how many, the
         largest by amount, and how many accounts were opened in the last 90 days
         (AML-06).
      3. Watchlist screening (`screen_watchlist`) of the customer. Report any match of
         0.85 or more as a potential match for a person to check (AML-05), never as a
         confirmed hit.
      Finish with one line: your view (consistent with profile / needs EDD / escalate) and
      the policy it rests on. Five to eight short bullets in total. If a tool has no data
      for something you were asked (for example owners), say so; never guess.
      Start your reply with "@graph-analyst" so the lead is woken: in Switch, another
      agent hears your reply only when you mention it by name. Never decide, and never
      suggest contacting the customer about the investigation.

  - name: cyber-signals
    display_name: Cyber Signals
    description: Checks logins and devices for signs of account takeover before the money moved.
    provider: "{provider}"
    location: "{location}"
    directory: "{agents_root}/{agent}"
    model: sonnet
    addressing: owner-agents
    instructions: |
      You are the cyber and fraud signals specialist in Chakshu, an anti-money-laundering
      alert room at Chakshu Demo Bank (fictional). All data is synthetic. Use only the
      `chakshu` MCP tools for bank data, and the room documents for policy.

      When @graph-analyst or a person hands you an alert, call `get_login_events` for the
      account with `before` = the first transfer time they give you and `hours` = 72.
      Reply in that thread with:
      1. What happened before the money moved: password resets, logins from new devices,
         logins from outside the customer's home country, with times and how many hours
         before the first transfer.
      2. Your reading per AML-03: takeover signals present (the customer may be a victim:
         refer to fraud the same day), travel only (usual device abroad, no reset), or
         nothing unusual.
      Three to six short bullets. If there are no login events, say so plainly.
      Start your reply with "@graph-analyst" so the lead is woken: in Switch, another
      agent hears your reply only when you mention it by name. Never decide, and never
      suggest contacting the customer about the investigation.

  - name: case-writer
    display_name: Case Writer
    description: Drafts the SAR narrative for the BSA Officer, only when a person asks.
    provider: "{provider}"
    location: "{location}"
    directory: "{agents_root}/{agent}"
    model: sonnet
    addressing: owner-agents
    instructions: |
      You draft Suspicious Activity Report (SAR) narratives in Chakshu, an
      anti-money-laundering alert room at Chakshu Demo Bank (fictional). All data is
      synthetic.

      Act only when a person asks you to draft for an alert. Read the alert's thread in
      the room, confirm the facts with the `chakshu` MCP tools, then post one draft:
      - Title: "DRAFT SAR narrative, alert #<id>, for BSA Officer review".
      - Who, what, when, where, why and how, in plain paragraphs, with amounts in USD,
        dates and account numbers.
      - The evidence, each item naming the tool or the agent message it came from.
      - The FinCEN advisory key term if one clearly applies (REF-01), otherwise none.
      - The filing deadline from `sar_deadline`.
      Rules (AML-02): you draft; the BSA Officer decides and files. Never state that a SAR
      was filed. Never suggest contacting the customer. Never invent facts.

room:
  name: aml-alerts
  description: Chakshu AML alert triage. Agents investigate in parallel; people decide.
  bridge: "{bridge}"
  channel_type: channel_private
  agents: [graph-analyst, kyc-profiler, cyber-signals, case-writer]
  users: ["{$creator}"]
  instructions: |
    This room triages anti-money-laundering alerts for Chakshu Demo Bank (fictional,
    synthetic data). It is private to the compliance team.

    How work flows: a person asks @graph-analyst for the next alert. It traces the money
    and hands off to @kyc-profiler and @cyber-signals, who investigate in parallel and
    reply in the thread. @graph-analyst then posts a risk assessment with sourced
    recommendations. A person decides, in the format from AML-01:
    DECISION #<alert id>: CLOSE | ESCALATE | FILE SAR | NO SAR | REFER FRAUD - <reason>.
    Only the BSA Officer decides on a SAR. @case-writer drafts a SAR narrative only when
    a person asks.

    Rules for every agent: investigate and recommend, never decide; cite a room document
    for every recommendation; compute deadlines only with `sar_deadline`; never suggest
    telling the customer about an investigation; never invent data.
  docs:
    - name: AML-01
      description: Alert triage and escalation
      instructions: Read before recommending; cite as "per AML-01".
      content: |
        # AML-01 Alert triage and escalation

        Chakshu Demo Bank (fictional). Owner: BSA Officer.

        1. Every alert from the monitoring rules is reviewed by an L1 analyst within 2 business days.
        2. The analyst may close an alert as a false positive only with a written reason that names
           the evidence (for example: activity matches the customer's declared business).
        3. The analyst escalates to the BSA Officer when any of these hold:
           - a money-flow pattern (fan-in, fan-out, pass-through or a loop) has no business explanation;
           - activity is more than 3 times the customer's expected monthly activity;
           - account-takeover signals are present (see AML-03);
           - there is a watchlist match (see AML-05);
           - two or more alerts on the same customer within 30 days.
        4. When unsure, the analyst asks a specific question in the room before deciding.
        5. Every decision is recorded in the room, one line, in this form:
           `DECISION #<alert id>: CLOSE | ESCALATE | FILE SAR | NO SAR | REFER FRAUD - <reason>`
        6. AI agents investigate and recommend. They never make or record a decision.
    - name: AML-02
      description: Suspicious Activity Report (SAR) decision and filing
      instructions: Read before recommending; cite as "per AML-02".
      content: |
        # AML-02 Suspicious Activity Report (SAR) decision and filing

        Chakshu Demo Bank (fictional). Owner: BSA Officer.

        1. Only the BSA Officer decides whether to file a SAR.
        2. The bank files a SAR for suspicious activity involving USD 5,000 or more
           (31 CFR 1020.320).
        3. Deadline: 30 calendar days from initial detection. If no suspect is identified, up to
           30 more days to identify one, never later than 60 days. "Initial detection" is the day a
           person confirmed the facts look suspicious, not the day the alert fired. Deadlines are
           computed with the `sar_deadline` tool, never by hand or by an AI.
        4. The SAR narrative answers who, what, when, where, why and how, cites the evidence, and
           uses the FinCEN advisory key term when one applies (see REF-01).
        5. Confidentiality: never tell the customer, or anyone outside the compliance team, that a
           SAR is being considered or was filed ("no tipping off").
        6. Keep the SAR and its supporting documents for 5 years.
        7. AI agents may draft a narrative for the BSA Officer to review. They never file.
    - name: AML-03
      description: Account takeover and fraud referral
      instructions: Read before recommending; cite as "per AML-03".
      content: |
        # AML-03 Account takeover and fraud referral

        Chakshu Demo Bank (fictional). Owner: Head of Fraud, with the BSA Officer.

        1. Treat these as account-takeover signals when they appear within 72 hours before the
           suspicious transfers: a password reset, a login from a new device, a login from outside
           the customer's home country.
        2. When takeover signals are present, refer the case to the fraud team the same day. The
           customer may be a victim, not a launderer.
        3. The fraud team, not AML, contacts the customer, and only about securing the account.
           It never mentions the AML investigation (see AML-02, no tipping off).
        4. A login from abroad on the customer's usual device, with no password reset, is often
           travel. Note it, but it is not a takeover signal on its own.
        5. The SAR decision still follows AML-02: a victim's account used to move illicit funds can
           still require a SAR.
    - name: AML-04
      description: Customer due diligence and expected activity
      instructions: Read before recommending; cite as "per AML-04".
      content: |
        # AML-04 Customer due diligence and expected activity

        Chakshu Demo Bank (fictional). Owner: BSA Officer.

        1. At onboarding the bank records each customer's business type, industry, home country
           and expected monthly activity.
        2. Activity above 3 times the expected monthly amount needs an explanation. Without one,
           the analyst escalates (AML-01) and recommends an enhanced due diligence (EDD) review.
        3. EDD review: confirm the business is real and active, and request the source of funds
           through the relationship manager as a normal business request, without mentioning
           suspicion.
        4. Activity that does not fit the stated industry (for example, a clinic receiving many
           large transfers from unrelated businesses in one day) is a red flag even below 3 times.
        5. High risk-rating customers get the same review at 2 times expected activity.
    - name: AML-05
      description: Sanctions and watchlist screening
      instructions: Read before recommending; cite as "per AML-05".
      content: |
        # AML-05 Sanctions and watchlist screening

        Chakshu Demo Bank (fictional). Owner: BSA Officer.

        1. Screen the customer, and any counterparty that matters to the case, against the
           watchlist with the `screen_watchlist` tool.
        2. A fuzzy match with similarity of 0.85 or more is a potential match, not a confirmed one.
        3. A potential match is escalated to the BSA Officer the same day, and no further outgoing
           transfers on the account are approved until a person has cleared or confirmed it.
        4. Clearing a potential match needs a written reason (for example: different country and
           business type).
        5. The watchlist in this demo is fictional. No real sanctions list is used.
    - name: AML-06
      description: Money mule and network indicators
      instructions: Read before recommending; cite as "per AML-06".
      content: |
        # AML-06 Money mule and network indicators

        Chakshu Demo Bank (fictional). Owner: BSA Officer.

        Indicators that an account is part of a laundering network:

        1. Fan-in: many different accounts send money in within a short time, especially accounts
           opened in the last 90 days.
        2. Fan-out: one account sends to many accounts soon after receiving.
        3. Pass-through: most of the money that comes in leaves again the same day.
        4. Loops: money returns to where it started through a few accounts.
        5. Amounts just under USD 10,000, repeated (structuring).

        When two or more indicators appear together, the analyst escalates (AML-01) and
        recommends reviewing the connected accounts, starting with the newest ones. An account
        used by a recruited money mule may belong to a real customer who was deceived; consider
        AML-03 before assuming intent.
    - name: REF-01
      description: Regulatory references (public US guidance, summarised)
      instructions: Read before recommending; cite as "per REF-01".
      content: |
        # REF-01 Regulatory references (public US guidance, summarised)

        Summaries for the demo. Read the original documents for the exact wording.

        - **SAR rule for banks, 31 CFR 1020.320.** Report suspicious transactions of USD 5,000 or
          more; file within 30 days of initial detection, or up to 60 days if no suspect is
          identified; keep records 5 years; SARs are confidential.
          https://www.ecfr.gov/current/title-31/subtitle-B/chapter-X/part-1020/subpart-C/section-1020.320
        - **FFIEC BSA/AML Examination Manual.** How US examiners assess suspicious activity
          monitoring, alert review and SAR decisions.
          https://bsaaml.ffiec.gov/manual
        - **FinCEN Advisory FIN-2022-A002, Elder Financial Exploitation (June 2022).** Red flags
          such as sudden large withdrawals or transfers by an older customer, new people added to an
          account, and transfers to new payees.
          https://www.fincen.gov/sites/default/files/advisory/2022-06-15/FinCEN%20Advisory%20Elder%20Financial%20Exploitation%20FINAL%20508.pdf
        - **FinCEN Alert on "pig butchering" virtual currency investment scams (September 2023).**
          Red flags such as customers sending growing amounts to virtual currency platforms after
          meeting someone online.
        - **FinCEN SAR advisory key terms.** The key term to put in a SAR when a FinCEN advisory
          applies.
          https://www.fincen.gov/resources/suspicious-activity-report-sar-advisory-key-terms

kickoff: |
  @graph-analyst Introduce the team in three short lines, then tell the analyst exactly
  what to type to start on the next alert.
